
name: Dual Platform GuardianConnectSDK build and package

on:
  workflow_dispatch:
    branches: [ "*" ]
    
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

defaults:
  run:
    working-directory: .\GuardianConnectSDK
    
jobs:

  build-both-architectures:

    strategy:
      matrix:
        configuration: [Release]
          
    runs-on: windows-2022

    env:
      Solution_Name: GuardianConnectSDK.sln
      unsignedzipfile: "UnsignedGuardianBinaries.zip"
      signedzipfile: "SignedGuardianBinaries.zip"

    steps:
    - name: Checkout
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Get a dir
      run: dir
      shell: cmd

    # Get CPU Architecture from Github variable
    - name: Get CPU from GH's $RUNNER_ARCH
      run: |
          $cpu = $env:RUNNER_ARCH.replace('X', 'x').replace('ARM', 'arm')
          echo "CPU=$cpu" | Out-File -FilePath $Env:GITHUB_ENV -Encoding utf8 -Append

    # Show env
    - name: Show env after above with colon syntax
      run: echo "$env:CPU"

    - name: Extract Version and set as env var
      shell: pwsh
      run: |
            $version = Select-String '<Version>(.+?)</Version>' Directory.Build.Props | % { $_.Matches[0].Groups[1].Value }
            "PKGVERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Use the extracted value
      run: |
        echo "PKGVERSION="${{ env.PKGVERSION }}

    # Add  MSBuild to the PATH: https://github.com/microsoft/setup-msbuild
    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v2

    - name: Build GuardianConnect for x64 CPU
      run: msbuild /t:restore /t:Build /p:Platform=x64 /p:Configuration=Release /p:RuntimeIdentifier=win-x64 GuardianConnect\GuardianConnect.csproj
      
    - name: Build GuardianConnect for ARM64 CPU
      run: msbuild /t:restore /t:Build /p:Platform=arm64 /p:Configuration=Release /p:RuntimeIdentifier=win-arm64 GuardianConnect\GuardianConnect.csproj
      
    - name: Build GuardianFirewall Service for x64 CPU
      #PRE-AOT-run: msbuild /t:restore /t:Build /p:Platform=x64 /p:Configuration=Release /p:RuntimeIdentifier=win-x64 GuardianFirewallService\GuardianFirewallService.csproj
      #run: msbuild /t:restore /t:Publish /p:Platform=x64 /p:Configuration=Release /p:RuntimeIdentifier=win-x64 GuardianFirewallService\GuardianFirewallService.csproj /p:PublishSingleFile=true /p:SelfContained=true /p:PublishTrimmed=true
      run: msbuild /t:restore /t:Publish /p:SelfContained=true /p:_IsPortable=false /p:PublishSingleFile=true /p:PublishReadyToRun=false /p:PublishTrimmed=true /p:IncludeNativeLibrariesForSelfExtract=false /p:IncludeAllContentForSelfExtract=false /p:Configuration=Release /p:Platform=x64 /p:RuntimeIdentifier=win-x64 GuardianFirewallService\GuardianFirewallService.csproj

    - name: Build GuardianFirewall Service for arm64 CPU
      #PRE_AOT-run: msbuild /t:restore /t:Build /p:Platform=arm64 /p:Configuration=Release /p:RuntimeIdentifier=win-arm64 GuardianFirewallService\GuardianFirewallService.csproj
      #run: msbuild /t:restore /t:Publish /p:Platform=arm64 /p:Configuration=Release /p:RuntimeIdentifier=win-arm64 GuardianFirewallService\GuardianFirewallService.csproj /p:PublishSingleFile=true /p:SelfContained=true /p:PublishTrimmed=true
      run: msbuild /t:restore /t:Publish /p:SelfContained=true /p:_IsPortable=false /p:PublishSingleFile=true /p:PublishReadyToRun=false /p:PublishTrimmed=true /p:IncludeNativeLibrariesForSelfExtract=false /p:IncludeAllContentForSelfExtract=false /p:Configuration=Release /p:Platform=arm64 /p:RuntimeIdentifier=win-arm64 GuardianFirewallService\GuardianFirewallService.csproj

    ## PAUSE HERE - Going to ONLY gather and upload the Guardian assets to SignPath in a zip. Both x64 and arm64.
    ## GuardianConnect.Shared.dll, GuardianConnect.dll, NativeRoutines.dll, GuardianFirewallService.exe and GuardianFirewallService.dll
    ## Second thought - we will just do that for both the GuardianConnect build output AND the GuardianFirewallService build output - so a little redundant on the GC binaries
    ## as it is much easier to add the binaries in-place to the zip, sign the binaries in that zip file, then extract with overlay in-place
    ## so that the nuget package builds flow easier (we have limited pathing and variables in the nuspecs). And then we can also sign the Nuget packages later on.

##    - name: Run sigcheck64 utility to verify binaries
##      run: bin\sigcheck64 -nobanner -accepteula  -s -a BuildOutput\GuardianConnect\runtimes\win10-x64\lib\net9.0-windows\Guardian*.dll
##      shell: cmd

     # Zip up our binaries for specific zip signing in SignPath
    - name: Zip Guardian binaries for SignPath deep-signing
      run: 7z a -bb3 "${{ env.unsignedzipfile }} @ListOfGuardianConnectSDKFilesToSign.fls
      shell: cmd

##    - name: Upload build artifacts - both SDKs AND AOT-version of GuardianFirewallService.exe - UNSIGNED SO WE CAN GIVE AS SAMPLE TO SIGNPATH
##      uses: actions/upload-artifact@v4
##      with:
##        name: "Upload UnsignedGuardianBinaries_${{env.PKGVERSION}}.zip"
##        path: D:\a\GuardianConnect-Windows\GuardianConnect-Windows\GuardianConnectSDK\UnsignedGuardianBinaries_${{env.PKGVERSION}}.zip
      
      # Sign Guardian binaries only  Executable with certificate
    - name: Sign Guardian Binaries with certificate
      run: Install-Module -Name SignPath -Force
        
        Submit-SigningRequest `
        -OrganizationId "5c1e4170-8bf7-48b1-8542-78374ccc3471" `
        -ApiToken "${{ secrets.CI_SIGNPATH_USER_TOKEN }}" `
        -ProjectSlug "Guardian" `
        -SigningPolicySlug "Guardian_DNSF_Branded" `
        -ArtifactConfigurationSlug  "NoCPP_SDK_and_AOT_SVC" `
        -InputArtifactPath "${{ env.unsignedzipfile }}" `
        -OutputArtifactPath "${{ env.signedzipfile }}" `
        -WaitForCompletion
      
      # Unzip what has just been signed
    - name: Unzip the newly-created file to list Guardian binaries for SignPath deep-signing
      run: 7z x -aoa -bb3 "${{ env.signedzipfile }}"

    - name: Create GuardianConnectSDK_x64.nupkg package bundle for EACH CPU build - x64 first
      run: nuget pack GuardianConnectSDK_x64.nuspec -Version ${{env.PKGVERSION}}
      shell: cmd
    
    - name: Create GuardianConnectSDK_ARM64.nupkg package bundle for EACH CPU build - then ARM64
      run: nuget pack GuardianConnectSDK_ARM64.nuspec -Version ${{env.PKGVERSION}}
      shell: cmd
      
    - name: Upload build artifacts - both SDKs - x64 first- UNSIGNED SO WE CAN GIVE AS SAMPLE TO SIGNPATH
      uses: actions/upload-artifact@v4
      with:
        name: "GuardianConnectSDK_x64.${{env.PKGVERSION}}.nupkg"
        path: D:\a\GuardianConnect-Windows\GuardianConnect-Windows\GuardianConnectSDK\GuardianConnectSDK_x64.${{env.PKGVERSION}}.nupkg

    - name: Upload build artifacts - both SDKs - now ARM64 - UNSIGNED SO WE CAN GIVE AS SAMPLE TO SIGNPATH
      uses: actions/upload-artifact@v4
      with:
        name: "GuardianConnectSDK_ARM64.${{env.PKGVERSION}}.nupkg"
        path: D:\a\GuardianConnect-Windows\GuardianConnect-Windows\GuardianConnectSDK\GuardianConnectSDK_ARM64.${{env.PKGVERSION}}.nupkg
    
    - name: Create GuardianFirewallService.nupkg package bundle
      run: nuget pack GuardianFirewallService.nuspec -Version ${{env.PKGVERSION}}
      shell: cmd
      
    - name: Upload build artifacts - GuardianFirewall Service - UNSIGNED SO WE CAN GIVE AS SAMPLE TO SIGNPATH
      uses: actions/upload-artifact@v4
      with:
        name: GuardianFirewallService.${{env.PKGVERSION}}.nupkg 
        path: D:\a\GuardianConnect-Windows\GuardianConnect-Windows\GuardianConnectSDK\GuardianFirewallService.${{env.PKGVERSION}}.nupkg 
        
      # Sign GuardianConnectSDK x64 package with certificate
      # Name GuardianConnectSDK<Platform> Nuget Package
      # Slug GuardianConnectSDK_<Platform>_Nuget_Package
    - name: Sign GuardianConnectSDK_x64 package with certificate
      run: Install-Module -Name SignPath -Force

        Submit-SigningRequest `
        -OrganizationId "5c1e4170-8bf7-48b1-8542-78374ccc3471" `
        -ApiToken "${{ secrets.CI_SIGNPATH_USER_TOKEN }}" `
        -ProjectSlug "Guardian" `
        -SigningPolicySlug "Guardian_DNSF_Branded" `
        -ArtifactConfigurationSlug GuardianConnectSDK_x64_Nuget_Package `
        -InputArtifactPath "GuardianConnectSDK_x64.${{env.PKGVERSION}}.nupkg" `
        -OutputArtifactPath "SIGNED_GuardianConnectSDK_x64.${{env.PKGVERSION}}.nupkg"  `
        -WaitForCompletion
      
    # Sign GuardianConnectSDK ARM64 package with certificate
    # Name GuardianConnectSDK ARM64 Nuget Package
    # Slug GuardianConnectSDK_ARM64_Nuget_Package
    - name: Sign GuardianConnectSDK_ARM64 package with certificate
      run: Install-Module -Name SignPath -Force

        Submit-SigningRequest `
        -InputArtifactPath "GuardianConnectSDK_ARM64.${{env.PKGVERSION}}.nupkg" `
        -ApiToken "${{ secrets.CI_SIGNPATH_USER_TOKEN }}" `
        -OrganizationId "5c1e4170-8bf7-48b1-8542-78374ccc3471" `
        -ProjectSlug "Guardian" `
        -SigningPolicySlug "Guardian_DNSF_Branded" `
        -OutputArtifactPath "SIGNED_GuardianConnectSDK_ARM64.${{env.PKGVERSION}}.nupkg"  `
        -ArtifactConfigurationSlug GuardianConnectSDK_ARM64_Nuget_Package `
        -WaitForCompletion
    
    # Sign GuardianFirewallService package with certificate
    # Name GuardianFirewallService Windows Nuget Package
    # Slug GuardianConnectSDK_Windows_Nuget_Package
    - name: Sign GuardianFirewallService package with certificate
      run: Install-Module -Name SignPath -Force
        
        Submit-SigningRequest `
        -InputArtifactPath "GuardianFirewallService.${{env.PKGVERSION}}.nupkg" `
        -ApiToken "${{ secrets.CI_SIGNPATH_USER_TOKEN }}" `
        -OrganizationId "5c1e4170-8bf7-48b1-8542-78374ccc3471" `
        -ProjectSlug "Guardian" `
        -SigningPolicySlug "Guardian_DNSF_Branded" `
        -OutputArtifactPath "SIGNED_GuardianFirewallService.${{env.PKGVERSION}}.nupkg" `
        -ArtifactConfigurationSlug GuardianFirewallService_Nuget_Package `
        -WaitForCompletion
      
      # Upload the nuget packages: (https://github.com/marketplace/actions/upload-a-build-artifact)
    - name: Upload build artifacts - GuardianConnectSDK_x64
      uses: actions/upload-artifact@v4
      with:
        name: SIGNED_GuardianConnectSDK_x64.${{env.PKGVERSION}}.nupkg
        path: D:\a\GuardianConnect-Windows\GuardianConnect-Windows\GuardianConnectSDK\SIGNED_GuardianConnectSDK_x64.${{env.PKGVERSION}}.nupkg

    - name: Upload build artifacts - GuardianConnectSDK_ARM64
      uses: actions/upload-artifact@v4
      with:
        name: SIGNED_GuardianConnectSDK_ARM64.${{env.PKGVERSION}}.nupkg
        path: D:\a\GuardianConnect-Windows\GuardianConnect-Windows\GuardianConnectSDK\SIGNED_GuardianConnectSDK_ARM64.${{env.PKGVERSION}}.nupkg
        
    - name: Upload build artifacts - GuardianFirewall Service
      uses: actions/upload-artifact@v4
      with:
        name: SIGNED_GuardianFirewallService.${{env.PKGVERSION}}.nupkg 
        path: D:\a\GuardianConnect-Windows\GuardianConnect-Windows\GuardianConnectSDK\SIGNED_GuardianFirewallService.${{env.PKGVERSION}}.nupkg 
        
        
        # Add github as source for nuget
    - name: Add GitHub as nuget package source
      shell: cmd
      run: dotnet nuget add source --username time4dnsf --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text --name github "https://nuget.pkg.github.com/GuardianFirewall/index.json"
        
    # Update GitHub Packages with these nuget packages
    - name: Update GitHub with nuget packages - SDK x64
      run: nuget push SIGNED_GuardianConnectSDK_x64.${{env.PKGVERSION}}.nupkg `${{ secrets.GUARDIANFIREWALL_GH_PKG_TOKEN }} -Source GitHub -SkipDuplicate
    - name: Update GitHub with nuget packages - SDK ARM64
      run: nuget push SIGNED_GuardianConnectSDK_ARM64.${{env.PKGVERSION}}.nupkg `${{ secrets.GUARDIANFIREWALL_GH_PKG_TOKEN }} -Source GitHub -SkipDuplicate

    - name: Update GitHub with nuget packages - Service
      run: nuget push SIGNED_GuardianFirewallService.${{env.PKGVERSION}}.nupkg ${{ secrets.GUARDIANFIREWALL_GH_PKG_TOKEN }} -Source GitHub -SkipDuplicate
