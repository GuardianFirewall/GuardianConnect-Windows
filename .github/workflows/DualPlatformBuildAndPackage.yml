        -ProjectSlug "Guardian" `
        -SigningPolicySlug "Guardian_DNSF_Branded" `
        -ArtifactConfigurationSlug GuardianConnectServiceSDK_X64 `
        -InputArtifactPath "GuardianConnect_Services_SDK_x64.${{env.PKGVERSION}}.1.nupkg" `
        -OutputArtifactPath "SIGNED_GuardianConnect_Services_SDK_x64.${{env.PKGVERSION}}.1.nupkg"  `
        -WaitForCompletion

    - name: Sign GuardianConnectServicesSDK_arm64 package with certificate
      run: Install-Module -Name SignPath -Force

