
name: Dual Platform GuardianConnectSDK build and package

on:
  workflow_dispatch:
    branches: [ "*" ]
    
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

defaults:
  run:
    working-directory: .\GuardianConnectSDK
    
jobs:

  build-both-architectures:

    strategy:
      matrix:
        configuration: [Release]
          
    runs-on: windows-2022

    env:
      Solution_Name: GuardianConnectSDK.sln
      unsignedzipfile: "UnsignedGuardianBinaries.zip"
      signedzipfile: "SignedGuardianBinaries.zip"

    steps:
    - name: Checkout
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Get a dir
      run: dir
      shell: cmd

    # Get CPU Architecture from Github variable
    - name: Get CPU from GH's $RUNNER_ARCH
      run: |
          $cpu = $env:RUNNER_ARCH.replace('X', 'x').replace('ARM', 'arm')
          echo "CPU=$cpu" | Out-File -FilePath $Env:GITHUB_ENV -Encoding utf8 -Append

    # Show env
    - name: Show env after above with colon syntax
      run: echo "$env:CPU"

    - name: Extract Version and set as env var
      shell: pwsh
      run: |
            $version = Select-String '<Version>(.+?)</Version>' Directory.Build.Props | % { $_.Matches[0].Groups[1].Value }
            "PKGVERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Use the extracted value
      run: |
        echo "PKGVERSION="${{ env.PKGVERSION }}

    - name: Create GuardianConnectSDK_NugetPackages folder
      shell: cmd
      run: md ..\GuardianConnectSDK_NugetPackages

    # Add  MSBuild to the PATH: https://github.com/microsoft/setup-msbuild
    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v2

    - name: Build GuardianConnect for x64 CPU
      run: msbuild /t:restore /t:Build /p:Platform=x64 /p:Configuration=Release /p:RuntimeIdentifier=win-x64 GuardianConnect\GuardianConnect.csproj

    - name: Build GuardianConnect for ARM64 CPU
      run: msbuild /t:restore /t:Build /p:Platform=arm64 /p:Configuration=Release /p:RuntimeIdentifier=win-arm64 GuardianConnect\GuardianConnect.csproj
    
    - name: Build GuardianConnect.Services for x64 CPU
      run: msbuild /t:restore /t:Build /p:Platform=x64 /p:Configuration=Release /p:RuntimeIdentifier=win-x64 GuardianConnect.Services\GuardianConnect.Services.csproj
      
    - name: Build GuardianConnect.Services for ARM64 CPU
      run: msbuild /t:restore /t:Build /p:Platform=arm64 /p:Configuration=Release /p:RuntimeIdentifier=win-arm64 GuardianConnect.Services\GuardianConnect.Services.csproj
      
    - name: Build GuardianConnectSDK.Services.Abstractions for any CPU
      run: msbuild /t:restore /t:Build /p:Configuration=Release GuardianConnect.Abstractions\GuardianConnect.Abstractions.csproj
      
####    - name: Build GuardianFirewall Service for x64 CPU
